apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-api
spec:
  ingressClassName: traefik
  rules:
    - host: todo.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: todo-api, port: { name: http } }
